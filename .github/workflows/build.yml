# =============================================================================
# Build OpenWrt RESMI (target armsr/armv8) + dukungan Amlogic GXL (S905X/HG680P)
#
# Simpan file ini di repo GitHub Anda sebagai:  .github/workflows/build.yml
# Jalankan dari tab Actions -> "Build OpenWrt armsr HG680P" -> Run workflow.
#
# Yang diubah dari OpenWrt resmi HANYA konfigurasi kernel (fragmen di bawah).
# Source, rootfs, dan paket tetap resmi.
#
# Hasil (Artifacts):
#   - openwrt-image      : *-combined-efi.img.gz (tulis ke flashdisk/SD)
#   - verify-report      : daftar simbol kernel yang berhasil/gagal aktif,
#                          log kernel_oldconfig, dan config kernel hasil resolusi
#   - packages-feed      : paket + kmod hasil build (feed sendiri)
# =============================================================================
name: Build OpenWrt armsr HG680P

on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: "Tag/branch OpenWrt resmi"
        default: "v25.12.6"
      all_kmods:
        description: "Build SEMUA paket kmod (lebih lama, hasil lebih besar)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      OPENWRT_REF: ${{ inputs.openwrt_ref }}
      ALL_KMODS: ${{ inputs.all_kmods }}

    steps:
      - name: Kosongkan ruang disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Pasang dependensi build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev \
            file wget libelf-dev xsltproc zstd

      - name: Clone OpenWrt resmi
        run: |
          git clone --depth 1 --branch "$OPENWRT_REF" https://github.com/openwrt/openwrt.git openwrt

      - name: Restore cache dl/
        uses: actions/cache/restore@v4
        with:
          path: openwrt/dl
          key: dl-${{ inputs.openwrt_ref }}-${{ github.run_id }}
          restore-keys: dl-${{ inputs.openwrt_ref }}-

      - name: Restore cache ccache
        uses: actions/cache/restore@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ inputs.openwrt_ref }}-${{ github.run_id }}
          restore-keys: ccache-${{ inputs.openwrt_ref }}-

      - name: Update dan install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Tulis fragmen config kernel
        run: |
          cat > "$GITHUB_WORKSPACE/kernel.fragment" <<'EOF'
          # ---- Platform Amlogic GXL (S905X) ----
          CONFIG_ARCH_MESON=y
          CONFIG_COMMON_CLK_GXBB=y
          CONFIG_COMMON_CLK_SCPI=y
          CONFIG_ARM_SCPI_PROTOCOL=y
          CONFIG_MAILBOX=y
          CONFIG_ARM_MHU=y
          CONFIG_PINCTRL_MESON=y
          CONFIG_PINCTRL_MESON_GXL=y
          CONFIG_RESET_MESON=y
          CONFIG_MESON_SM=y
          CONFIG_MESON_GX_SOCINFO=y
          CONFIG_MESON_IRQ_GPIO=y
          # ---- Serial (konsol UART) ----
          CONFIG_SERIAL_MESON=y
          CONFIG_SERIAL_MESON_CONSOLE=y
          CONFIG_SERIAL_EARLYCON=y
          # ---- eMMC / SD ----
          CONFIG_MMC=y
          CONFIG_MMC_BLOCK=y
          CONFIG_MMC_MESON_GX=y
          CONFIG_PWRSEQ_EMMC=y
          CONFIG_PWRSEQ_SIMPLE=y
          CONFIG_REGULATOR=y
          CONFIG_REGULATOR_FIXED_VOLTAGE=y
          CONFIG_PWM=y
          CONFIG_PWM_MESON=y
          # ---- USB (built-in agar rootfs di USB terbaca tanpa initrd) ----
          CONFIG_USB=y
          CONFIG_USB_XHCI_HCD=y
          CONFIG_USB_XHCI_PLATFORM=y
          CONFIG_USB_DWC3=y
          CONFIG_USB_DWC3_MESON_G12A=y
          CONFIG_PHY_MESON_GXL_USB2=y
          CONFIG_USB_STORAGE=y
          CONFIG_USB_UAS=y
          CONFIG_SCSI=y
          CONFIG_BLK_DEV_SD=y
          # ---- Ethernet internal (RMII + PHY GXL) ----
          CONFIG_STMMAC_ETH=y
          CONFIG_STMMAC_PLATFORM=y
          CONFIG_DWMAC_MESON=y
          CONFIG_MDIO_BUS_MUX=y
          CONFIG_MDIO_BUS_MUX_MESON_GXL=y
          CONFIG_MESON_GXL_PHY=y
          # ---- Lain-lain ----
          CONFIG_HW_RANDOM_MESON=y
          CONFIG_MESON_GXBB_WATCHDOG=y
          CONFIG_RTC_DRV_MESON_VRTC=y
          EOF
          cat "$GITHUB_WORKSPACE/kernel.fragment"

      - name: Terapkan fragmen ke config kernel armsr
        working-directory: openwrt
        run: |
          set -euo pipefail
          kv=$(sed -n 's/^KERNEL_PATCHVER[[:space:]]*:\?=[[:space:]]*//p' target/linux/armsr/Makefile | head -n1)
          [ -n "$kv" ] || { echo "KERNEL_PATCHVER tidak ditemukan"; exit 1; }
          echo "Kernel armsr: $kv"

          gen="target/linux/generic/config-$kv"
          tops="target/linux/armsr/config-$kv"
          sub="target/linux/armsr/armv8/config-$kv"
          if [ -f "$sub" ]; then dest="$sub"; else dest="$tops"; fi
          [ -f "$dest" ] || { echo "config armsr tidak ditemukan"; exit 1; }
          echo "Fragmen ditambahkan ke: $dest"

          frag="$GITHUB_WORKSPACE/kernel.fragment"
          while IFS= read -r line; do
            case "$line" in
              CONFIG_*=*) sym=${line%%=*} ;;
              *) continue ;;
            esac
            for f in "$gen" "$tops" "$sub"; do
              [ -f "$f" ] && sed -i -e "/^${sym}=/d" -e "/^# ${sym} is not set\$/d" "$f"
            done
          done < "$frag"
          grep -E '^CONFIG_' "$frag" >> "$dest"
          echo "$dest" > "$GITHUB_WORKSPACE/kconfig.dest"

      - name: Config OpenWrt (target + paket)
        working-directory: openwrt
        run: |
          set -euo pipefail
          cat > .config <<'EOF'
          CONFIG_CCACHE=y
          CONFIG_GRUB_BOOTOPTS="console=ttyAML0,115200n8 earlycon=meson,0xc81004c0"
          CONFIG_TARGET_armsr=y
          CONFIG_TARGET_armsr_armv8=y
          CONFIG_TARGET_armsr_armv8_DEVICE_generic=y
          CONFIG_TARGET_KERNEL_PARTSIZE=64
          CONFIG_TARGET_ROOTFS_PARTSIZE=512
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          # CONFIG_TARGET_ROOTFS_SQUASHFS is not set
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_blkid=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_lsblk=y
          CONFIG_PACKAGE_resize2fs=y
          CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
          CONFIG_PACKAGE_kmod-usb-net-asix-ax88179=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_htop=y
          EOF
          if [ "$ALL_KMODS" = "true" ]; then echo "CONFIG_ALL_KMODS=y" >> .config; fi
          make defconfig
          grep -E '^CONFIG_TARGET_armsr' .config
          grep -E '^CONFIG_GRUB' .config || echo 'CATATAN: opsi GRUB_BOOTOPTS tidak berlaku di target ini'

      - name: Download source
        working-directory: openwrt
        run: make download -j8

      - name: Build tools + toolchain
        working-directory: openwrt
        run: |
          make -j"$(nproc)" tools/install toolchain/install || { make -j1 V=s tools/install toolchain/install 2>&1 | tail -n 300; exit 1; }

      - name: Resolusi simbol kernel BARU (otomatis ambil nilai default)
        working-directory: openwrt
        run: |
          # Mengaktifkan ARCH_MESON memunculkan puluhan simbol baru yang harus
          # punya nilai. kernel_oldconfig resmi OpenWrt menjawab semua prompt
          # dengan default (Enter) lalu menulis hasilnya ke config-<versi> armsr.
          set +e
          yes '' | make kernel_oldconfig CONFIG_TARGET=subtarget > "$GITHUB_WORKSPACE/oldconfig.log" 2>&1
          rc=${PIPESTATUS[1]}
          set -e
          tail -n 40 "$GITHUB_WORKSPACE/oldconfig.log"
          [ "$rc" -eq 0 ] || { echo "kernel_oldconfig gagal (kode $rc)"; exit 1; }
          ls -l target/linux/armsr/armv8/config-* target/linux/armsr/config-* 2>/dev/null || true

      - name: Kompilasi kernel (otomatis isi simbol baru yang tersisa)
        working-directory: openwrt
        run: |
          cat > "$GITHUB_WORKSPACE/resolve_new.py" <<'PYEOF'
          import re, sys
          log, dest = sys.argv[1], sys.argv[2]
          text = open(log, errors="replace").read()
          ms = list(re.finditer(r"\(([A-Z0-9_]+)\)\s*\[([^\]]*)\]\s*\(NEW\)", text))
          if not ms:
              sys.exit(1)
          sym, br = ms[-1].group(1), ms[-1].group(2).strip()
          cur = open(dest).read()
          if re.search(r"^(CONFIG_%s=|# CONFIG_%s is not set)" % (sym, sym), cur, re.M):
              print("Simbol %s sudah ada tapi tetap diminta ulang" % sym)
              sys.exit(2)
          if "/" in br:
              up = [t for t in br.split("/") if t.isupper()]
              line = "CONFIG_%s=y" % sym if up and up[0] == "Y" else "# CONFIG_%s is not set" % sym
          elif re.fullmatch(r"-?\d+|0x[0-9a-fA-F]+", br):
              line = "CONFIG_%s=%s" % (sym, br)
          else:
              line = 'CONFIG_%s="%s"' % (sym, br)
          with open(dest, "a") as f:
              f.write(line + "\n")
          print("Ditambahkan:", line)
          PYEOF
          dest=$(cat "$GITHUB_WORKSPACE/kconfig.dest")
          ok=0
          for i in $(seq 1 300); do
            if make -j"$(nproc)" V=s target/linux/compile > "$GITHUB_WORKSPACE/kcompile.log" 2>&1; then
              ok=1; echo "Kernel selesai dikompilasi (percobaan ke-$i)"; break
            fi
            if python3 "$GITHUB_WORKSPACE/resolve_new.py" "$GITHUB_WORKSPACE/kcompile.log" "$dest"; then
              continue
            fi
            echo "Bukan masalah simbol baru. Ekor log:"
            tail -n 60 "$GITHUB_WORKSPACE/kcompile.log"
            make -j1 V=s target/linux/compile 2>&1 | tail -n 250
            exit 1
          done
          [ "$ok" = 1 ] || { echo "Terlalu banyak iterasi"; exit 1; }

      - name: Build penuh
        working-directory: openwrt
        run: |
          make -j"$(nproc)" || { make -j1 V=s 2>&1 | tail -n 300; exit 1; }

      - name: Verifikasi simbol kernel
        if: always()
        working-directory: openwrt
        run: |
          cfg=$(ls build_dir/target-*/linux-armsr_*/linux-*/.config 2>/dev/null | head -n1 || true)
          {
            echo "Kernel .config: ${cfg:-<belum terbentuk>}"
            if [ -n "$cfg" ]; then
              cp "$cfg" "$GITHUB_WORKSPACE/kernel-final.config"
              while IFS= read -r line; do
                case "$line" in CONFIG_*=*) ;; *) continue ;; esac
                sym=${line%%=*}
                got=$(grep -E "^${sym}=|^# ${sym} is not set\$" "$cfg" || true)
                if [ "$got" = "$line" ]; then echo "OK   $line"
                else echo "GAGAL $line  ->  ${got:-<tidak ada: dependensi tidak terpenuhi atau nama simbol salah>}"; fi
              done < "$GITHUB_WORKSPACE/kernel.fragment"
            fi
          } | tee "$GITHUB_WORKSPACE/verify-report.txt"

      - name: Upload image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-image
          if-no-files-found: warn
          path: |
            openwrt/bin/targets/armsr/armv8/*combined-efi*
            openwrt/bin/targets/armsr/armv8/*kernel*
            openwrt/bin/targets/armsr/armv8/*.manifest
            openwrt/bin/targets/armsr/armv8/sha256sums
            openwrt/bin/targets/armsr/armv8/config.buildinfo

      - name: Upload laporan verifikasi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          if-no-files-found: warn
          path: |
            verify-report.txt
            kernel-final.config
            oldconfig.log
            kcompile.log
            openwrt/target/linux/armsr/armv8/config-*
            openwrt/target/linux/armsr/config-*

      - name: Upload feed paket (kmod + paket)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: packages-feed
          if-no-files-found: warn
          path: |
            openwrt/bin/packages
            openwrt/bin/targets/armsr/armv8/packages

      - name: Simpan cache dl/ (selalu)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: openwrt/dl
          key: dl-${{ inputs.openwrt_ref }}-${{ github.run_id }}

      - name: Simpan cache ccache (selalu)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ inputs.openwrt_ref }}-${{ github.run_id }}
